name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the node:22 images the Dockerfiles build on.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make check

  # Kept out of make check because it needs Docker and takes minutes.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make images
